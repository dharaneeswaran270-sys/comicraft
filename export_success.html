comiccraft/templates/export_success.html
{% extends "base.html" %}


{% block content %}


<section class="success card">


    <div class="success-icon">
        ✓
    </div>


    <p class="eyebrow">
        EXPORT COMPLETE
    </p>


    <h1>
        Your comic is ready.
    </h1>


    <p>
        The PDF has been generated successfully.
    </p>


    {% if pdf_path %}

    <a
        class="button primary"
        href="{{ pdf_path }}"
        download
    >
        Download PDF Again
    </a>

    {% endif %}


    <a
        class="button secondary"
        href="/"
    >
        Go Create Another Comic
    </a>


</section>


{% endblock %}
